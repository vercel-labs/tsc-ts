name: CI

# Pull requests run lint, format, the build and the tests their changes select (scripts/ci/select-tests.mjs).
# Pushes to main and manual runs run every test. Releases require a green run for the push of the released commit
# (release.yml).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A new push to a pull request cancels its previous run. Runs for main each finish.
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.select.outputs.plan }}
      shards: ${{ steps.select.outputs.shards }}
      native: ${{ steps.select.outputs.native }}
      native-shards: ${{ steps.select.outputs.native-shards }}
      docs: ${{ steps.select.outputs.docs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            node scripts/ci/select-tests.mjs --base "$BASE" --head "$HEAD" --github-output
          else
            node scripts/ci/select-tests.mjs --full --github-output
          fi

  checks:
    name: lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run format:check
      - run: npm run lint
      - name: Check release notes
        run: node scripts/release-notes.mjs

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache-dependency-path: packages/tsc-ts/tests/xxh3-vectors/go.sum
      - uses: actions/cache@v4
        with:
          path: upstream
          key: upstream-${{ hashFiles('upstream.json') }}
      # Turbo's local cache. The oracles only change with these inputs, so their builds are restored from here. Turbo's
      # task hashes also cover the dependencies resolved in the lockfile, turbo.json and the packages' package.json,
      # so the key does too: otherwise a dependency bump keeps restoring entries for the old hashes and never saves
      # new ones.
      - uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-oracles-${{ hashFiles('upstream.json', 'packages/tsgo/oracles/**', 'packages/tsgo/checkhost/**', 'packages/tsgo/scripts/build-oracle.mjs', 'package-lock.json', 'turbo.json', 'packages/tsgo/package.json') }}
      - run: npm ci
      - run: npm run fetch:upstream
      - run: npx turbo run build build:oracle --filter='!@tsc-ts/web'
      - run: node scripts/ci/compile-tests.mjs packages/tsc-ts/dist/test-build
      # A tar keeps the executable bits that artifacts drop.
      - run: tar -cf build.tar packages/tsc-ts/dist packages/tsgo/dist
      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: build.tar
          retention-days: 3
          compression-level: 1

  test:
    name: test ${{ matrix.shard }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: upstream
          key: upstream-${{ hashFiles('upstream.json') }}
      - run: npm ci
      - run: npm run fetch:upstream
      - uses: actions/download-artifact@v4
        with:
          name: build
      - run: tar -xf build.tar && rm build.tar
      - name: Run tests
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          TSC_TS_TEST_BUILD: ${{ github.workspace }}/packages/tsc-ts/dist/test-build
        run: |
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          node scripts/ci/run-tests.mjs --plan "$RUNNER_TEMP/plan.json" --set node --shard ${{ matrix.shard }} --report "$RUNNER_TEMP/report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-${{ strategy.job-index }}
          path: ${{ runner.temp }}/report.json
          retention-days: 30

  # The shipped native tsc-ts (`npm run build:native`) and a native command line driver, for the native test units:
  # when a pull request changes runtime code of tsc-ts, and on every full run. Runs alongside the build job.
  native-build:
    name: native build
    needs: plan
    if: needs.plan.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - id: scriptc
        run: echo "version=$(node -p "require('./package.json').devDependencies.scriptc")" >> "$GITHUB_OUTPUT"
      # scriptc's precompiled runtime families, which depend only on the scriptc version.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/scriptc
          key: scriptc-${{ runner.os }}-${{ steps.scriptc.outputs.version }}
      - name: Build natively
        working-directory: packages/tsc-ts
        run: |
          npm run build:native > "$RUNNER_TEMP/tsc.log" 2>&1 &
          tsc=$!
          npx scriptc build src/drivers/cli.ts --optimization=speed --no-keep-llvm -o dist/cli > "$RUNNER_TEMP/cli.log" 2>&1 &
          cli=$!
          status=0
          wait $tsc || { status=1; cat "$RUNNER_TEMP/tsc.log"; }
          wait $cli || { status=1; cat "$RUNNER_TEMP/cli.log"; }
          exit $status
      - run: tar -cf native.tar packages/tsc-ts/dist/tsc packages/tsc-ts/dist/cli
      - uses: actions/upload-artifact@v4
        with:
          name: native
          path: native.tar
          retention-days: 3
          compression-level: 1

  native-test:
    name: native test ${{ matrix.shard }}
    needs: [plan, build, native-build]
    if: needs.plan.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.native-shards) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/cache/restore@v4
        with:
          path: upstream
          key: upstream-${{ hashFiles('upstream.json') }}
      - run: npm ci
      - run: npm run fetch:upstream
      - uses: actions/download-artifact@v4
        with:
          name: build
      - uses: actions/download-artifact@v4
        with:
          name: native
      - run: tar -xf build.tar && tar -xf native.tar && rm build.tar native.tar
      - name: Run native tests
        env:
          PLAN: ${{ needs.plan.outputs.plan }}
          TSC_TS_TEST_BUILD: ${{ github.workspace }}/packages/tsc-ts/dist/test-build
        run: |
          printf '%s' "$PLAN" > "$RUNNER_TEMP/plan.json"
          node scripts/ci/run-tests.mjs --plan "$RUNNER_TEMP/plan.json" --set native --shard ${{ matrix.shard }} --report "$RUNNER_TEMP/report.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report-native-${{ strategy.job-index }}
          path: ${{ runner.temp }}/report.json
          retention-days: 30

  # The API server on Windows, over standard input and output (as the native scriptc compiler starts it) and over the
  # named pipe it creates (as scriptc's Node host does): the native tsc-ts, linked with its Windows pipe server.
  windows-api:
    name: API server (windows)
    needs: plan
    if: needs.plan.outputs.native == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: vercel-labs/setup-zig@v1
        with:
          version: 0.16.0
      - run: npm ci
      - name: Build natively
        working-directory: packages/tsc-ts
        run: npm run build:native
      - name: Run the API server tests
        working-directory: packages/tsc-ts
        env:
          TSC_TS_BIN: packages/tsc-ts/dist/tsc.exe
        run: node --test tests/api-pipe.test.mjs
      - name: Check that only the current user can open the pipe
        working-directory: packages/tsc-ts
        shell: bash
        run: |
          zig cc -target x86_64-windows-gnu native/pipe-win32.test.c native/pipe-win32.c -ladvapi32 -o dist/pipe-win32-test.exe
          ./dist/pipe-win32-test.exe

  docs:
    name: documentation
    needs: plan
    if: needs.plan.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run type-check -w @tsc-ts/web
      - run: npm test -w @tsc-ts/web
      - run: npm run check:examples -w @tsc-ts/web
      - run: npm run build:web
      - run: npm run test:routes -w @tsc-ts/web

  # The npm packages as the release packs them, for linux-x64-gnu: pack.mjs --check installs them into a new project
  # with only tsc-ts, compiles it, and type-checks and runs code that uses tsc-ts/api. The executable is the latest
  # published one, because a pull request may not build natively and the check doesn't depend on its version.
  package:
    name: package (linux-x64-gnu)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # pack.mjs takes the lib files from the pinned upstream.
      - uses: actions/cache@v4
        with:
          path: upstream
          key: upstream-${{ hashFiles('upstream.json') }}
      - run: npm ci
      - run: npm run fetch:upstream
      - name: Pack and check
        run: |
          tarball=$(npm pack @tsc-ts/linux-x64-gnu --pack-destination "$RUNNER_TEMP" --silent)
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP"
          npm run pack:npm -w tsc-ts -- main platform --binary "$RUNNER_TEMP/package/lib/tsc-ts" --check

  # The one check branch protection needs: it fails when any job above failed or was cancelled.
  result:
    name: CI result
    needs: [plan, checks, build, test, native-build, native-test, windows-api, docs, package]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "job results: $RESULTS"
          if echo "$RESULTS" | grep -q -e failure -e cancelled; then exit 1; fi
