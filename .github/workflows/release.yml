name: Release

# A version bump merged to main releases after that commit's CI succeeds.
# The GitHub release creates the tag automatically. Dispatch from main to retry;
# `release_tag` optionally selects an existing tag instead of the current main commit.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing version tag to build and publish from a manual run
        required: false
        type: string

# Finish publishing before another main push checks whether the version is released.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-release:
    name: Check for new version
    if: github.repository == 'vercel-labs/tsc-ts' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      should_release: ${{ steps.check.outputs.should_release }}
      version: ${{ steps.check.outputs.version }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check GitHub release completion
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          VERSION=$(node -p "require('./packages/tsc-ts/package.json').version")
          TAG="v$VERSION"
          if [ -n "$RELEASE_TAG" ] && [ "$RELEASE_TAG" != "$TAG" ]; then
            echo "Tag $RELEASE_TAG does not match packages/tsc-ts version $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          RELEASE_DRAFT=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)
          if [ "$RELEASE_DRAFT" = false ]; then
            echo "Release $TAG is complete"
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Release $TAG needs publishing or completion"
            # A retry of an existing tag must keep its source commit, even if main has moved.
            SHA=$(git rev-parse --verify "refs/tags/$TAG^{commit}" 2>/dev/null || git rev-parse HEAD)
            echo "sha=$SHA" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  ci-green:
    name: CI is green on this commit
    needs: check-release
    if: needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    # The release and CI start on the same main push; wait up to 90 minutes for CI.
    timeout-minutes: 100
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-release.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare release notes
        run: node scripts/release-notes.mjs > "$RUNNER_TEMP/release-notes.md"
      - run: node scripts/ci/ci-status.mjs require-green "$(git rev-parse HEAD)" --wait 90
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}/release-notes.md
          if-no-files-found: error

  package:
    name: ${{ matrix.platform }}
    needs: [check-release, ci-green]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, runner: macos-15 }
          - { platform: darwin-x64, runner: macos-15-intel }
          - { platform: linux-arm64-gnu, runner: ubuntu-24.04-arm, target: aarch64-linux-gnu.2.34 }
          - { platform: linux-arm64-musl, runner: ubuntu-24.04-arm, docker: 'node:24-alpine' }
          - { platform: linux-x64-gnu, runner: ubuntu-24.04, target: x86_64-linux-gnu.2.34 }
          - { platform: linux-x64-musl, runner: ubuntu-24.04, docker: 'node:24-alpine' }
          - { platform: win32-x64-msvc, runner: windows-2025 }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-release.outputs.sha }}

      - uses: actions/setup-node@v4
        if: ${{ !matrix.docker }}
        with:
          node-version: 24
          cache: npm

      - uses: vercel-labs/setup-zig@v1
        if: ${{ matrix.platform == 'win32-x64-msvc' || matrix.target }}
        with:
          version: 0.16.0

      - name: Build and check
        if: ${{ !matrix.docker && !matrix.target }}
        run: |
          npm ci
          npm run fetch:upstream
          npm run pack:npm -w tsc-ts -- --check

      # The glibc executables link with zig against a glibc 2.34 sysroot, so they run on glibc 2.34 and newer
      # instead of requiring the runner's glibc. pack.mjs fails if one needs a newer glibc symbol version.
      - name: Build and check (glibc 2.34)
        if: ${{ matrix.target }}
        env:
          SCRIPTC_TARGET: ${{ matrix.target }}
        run: |
          npm ci
          npm run fetch:upstream
          npm run pack:npm -w tsc-ts -- --check

      # Actions can't run in Alpine containers on arm64, so musl builds run
      # in Docker directly.
      - name: Build and check (musl)
        if: ${{ matrix.docker }}
        run: >
          docker run --rm -v "$PWD:/repo" -w /repo ${{ matrix.docker }}
          sh -c 'apk add --no-cache clang git lld musl-dev zig && npm ci && npm run fetch:upstream && npm run pack:npm -w tsc-ts -- --check'

      - uses: actions/upload-artifact@v4
        with:
          name: tsc-ts-${{ matrix.platform }}
          path: packages/tsc-ts/dist/npm/tsc-ts-${{ matrix.platform }}-*.tgz
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux-x64-gnu'
        with:
          name: tsc-ts
          path: packages/tsc-ts/dist/npm/tsc-ts-[0-9]*.tgz
          if-no-files-found: error

  publish:
    name: Publish to npm
    needs: [check-release, ci-green, package]
    if: >-
      github.repository == 'vercel-labs/tsc-ts' &&
      github.ref == 'refs/heads/main' && needs.check-release.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: Release
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check-release.outputs.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check release version
        env:
          TAG: v${{ needs.check-release.outputs.version }}
        run: |
          VERSION=$(node -p "require('./packages/tsc-ts/package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Tag $TAG does not match packages/tsc-ts version $VERSION"
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          pattern: tsc-ts*
          path: packages/tsc-ts/dist/npm
          merge-multiple: true

      # Configure npm trusted publishing for tsc-ts and all seven @tsc-ts
      # platform packages: owner vercel-labs, repository tsc-ts, workflow
      # release.yml, environment Release. This job uses GitHub OIDC and
      # --provenance; it needs no npm token secret. Node 24 supplies the npm
      # version required for trusted publishing.
      - name: Publish platform packages and launcher
        shell: bash
        run: |
          shopt -s nullglob
          # Platform names start with a letter; the launcher version starts with a digit.
          platform_packages=(packages/tsc-ts/dist/npm/tsc-ts-[a-z]*-*.tgz)
          launcher_packages=(packages/tsc-ts/dist/npm/tsc-ts-[0-9]*.tgz)
          if [ "${#platform_packages[@]}" -ne 7 ] || [ "${#launcher_packages[@]}" -ne 1 ]; then
            echo "Expected seven platform packages and one launcher package"
            ls -l packages/tsc-ts/dist/npm
            exit 1
          fi
          for package in "${platform_packages[@]}"; do
            npm publish "$package" --provenance --access public
          done
          npm publish "${launcher_packages[0]}" --provenance --access public

  github-release:
    name: Create GitHub Release
    needs: [check-release, publish]
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download release notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ${{ runner.temp }}

      - name: Download published packages
        uses: actions/download-artifact@v4
        with:
          pattern: tsc-ts*
          path: ${{ runner.temp }}/npm
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.check-release.outputs.version }}
          RELEASE_SHA: ${{ needs.check-release.outputs.sha }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
              --title "$TAG" --draft --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
          gh release upload "$TAG" "$RUNNER_TEMP"/npm/*.tgz --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --draft=false
